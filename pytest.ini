[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .
addopts = -ra -q --strict-markers
markers =
    tier1: Tier 1 Feature Coverage (Category-Partition)
    tier2: Tier 2 Boundary & Corner (BVA / Extremes)
    tier3: Tier 3 Cross-Feature Combinations
    tier4: Tier 4 Real-World End-to-End Scenarios
    security: Security audit and hardening tests
    e2e: End-to-end integration tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestRemovedIn10Warning
    ignore::starlette.exceptions.StarletteDeprecationWarning
