  <style>
    :root[data-theme="dark"] {
      --bg-page: #000000;
      --bg-glow-1: rgba(10, 132, 255, 0.12);
      --bg-glow-2: rgba(94, 92, 230, 0.08);
      --bg-card: rgba(28, 28, 30, 0.82);
      --bg-elevated: rgba(44, 44, 46, 0.70);
      --bg-elevated-hover: rgba(58, 58, 60, 0.90);
      --bg-key: rgba(18, 18, 20, 0.90);
      --border-subtle: rgba(255, 255, 255, 0.14);
      --border-focus: #0a84ff;
      --text-primary: #ffffff;
      --text-secondary: #a1a1a6;
      --text-muted: #86868b;
      --accent-cyan: #0a84ff;
      --accent-cyan-hover: #2997ff;
      --accent-cyan-fg: #ffffff;
      --accent-cyan-soft: rgba(10, 132, 255, 0.16);
      --accent-green: #30d158;
      --accent-green-soft: rgba(48, 209, 88, 0.15);
      --shadow-card: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 24px 48px -12px rgba(0, 0, 0, 0.75);
      --shadow-glow-cyan: 0 0 24px rgba(10, 132, 255, 0.35);
      --shadow-glow-subtle: 0 0 16px rgba(10, 132, 255, 0.20);
      --pawn-glow: drop-shadow(0 0 14px rgba(10, 132, 255, 0.6)) drop-shadow(0 4px 10px rgba(0, 0, 0, 0.7));
    }

    :root[data-theme="light"] {
      --bg-page: #f5f5f7;
      --bg-glow-1: rgba(0, 113, 227, 0.08);
      --bg-glow-2: rgba(88, 86, 214, 0.05);
      --bg-card: rgba(255, 255, 255, 0.86);
      --bg-elevated: rgba(242, 242, 247, 0.88);
      --bg-elevated-hover: rgba(230, 230, 236, 0.95);
      --bg-key: #ffffff;
      --border-subtle: rgba(0, 0, 0, 0.10);
      --border-focus: #0071e3;
      --text-primary: #1d1d1f;
      --text-secondary: #6e6e73;
      --text-muted: #86868b;
      --accent-cyan: #0071e3;
      --accent-cyan-hover: #0077ed;
      --accent-cyan-fg: #ffffff;
      --accent-cyan-soft: rgba(0, 113, 227, 0.10);
      --accent-green: #34c759;
      --accent-green-soft: rgba(52, 199, 89, 0.12);
      --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.04), 0 20px 40px -15px rgba(0, 0, 0, 0.09);
      --shadow-glow-cyan: 0 6px 20px rgba(0, 113, 227, 0.26);
      --shadow-glow-subtle: 0 4px 12px rgba(0, 113, 227, 0.15);
      --pawn-glow: drop-shadow(0 4px 12px rgba(0, 113, 227, 0.3));
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-page);
      background-image:
        radial-gradient(circle at 20% 15%, var(--bg-glow-1), transparent 45%),
        radial-gradient(circle at 80% 85%, var(--bg-glow-2), transparent 45%);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background-color 0.25s cubic-bezier(0.25, 1, 0.5, 1), color 0.25s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .shell {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .topbar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      background: var(--bg-card);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      box-shadow: var(--shadow-card);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 14px;
    }

    .pawn-hero-img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      filter: var(--pawn-glow);
      flex-shrink: 0;
      transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .brand:hover .pawn-hero-img {
      transform: translateY(-2px) scale(1.05);
    }

    .brand-titles {
      display: flex;
      flex-direction: column;
      line-height: 1.15;
    }

    .brand-chess {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      font-weight: 700;
      font-size: 17px;
      letter-spacing: 0.22em;
      color: var(--text-primary);
    }

    .brand-stealth {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.32em;
      color: var(--accent-cyan);
      margin-top: 2px;
    }

    .theme-btn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-elevated);
      color: var(--text-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .theme-btn:hover {
      background: var(--bg-elevated-hover);
      border-color: var(--border-focus);
      box-shadow: var(--shadow-glow-subtle);
    }

    .theme-btn:active {
      transform: scale(0.97);
      transition-duration: 80ms;
    }

    .card {
      width: 100%;
      background: var(--bg-card);
      backdrop-filter: blur(32px) saturate(190%);
      -webkit-backdrop-filter: blur(32px) saturate(190%);
      border: 1px solid var(--border-subtle);
      border-radius: 22px;
      padding: 24px;
      box-shadow: var(--shadow-card);
    }

    h1 {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      font-size: 21px;
      font-weight: 700;
      margin-bottom: 16px;
      letter-spacing: -0.025em;
      line-height: 1.15;
      color: var(--text-primary);
    }

    .stepper {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .step-item {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .step-num {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--bg-key);
      border: 1px solid var(--border-subtle);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: "SF Mono", "JetBrains Mono", Consolas, monospace;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .step-state {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text-secondary);
    }

    .step-item.active {
      border-color: var(--accent-cyan);
      box-shadow: var(--shadow-glow-subtle);
    }

    .step-item.active .step-num {
      background: var(--accent-cyan);
      color: var(--accent-cyan-fg);
      border-color: var(--accent-cyan);
    }

    .step-item.active .step-state {
      color: var(--text-primary);
      font-weight: 700;
    }

    .step-item.done {
      border-color: var(--accent-green);
      background: var(--accent-green-soft);
    }

    .step-item.done .step-num {
      background: var(--accent-green);
      color: #060911;
      border-color: var(--accent-green);
    }

    .step-item.done .step-state {
      color: var(--accent-green);
    }

    .provider-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .provider-btn {
      min-height: 62px;
      border-radius: 14px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-elevated);
      color: var(--text-primary);
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      text-align: left;
      transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .provider-btn:hover {
      background: var(--bg-elevated-hover);
      border-color: var(--border-focus);
      box-shadow: var(--shadow-glow-subtle);
    }

    .provider-btn:active {
      transform: scale(0.975);
      transition-duration: 80ms;
    }

    .provider-btn.selected {
      border-color: var(--accent-cyan);
      background: var(--accent-cyan-soft);
      box-shadow: var(--shadow-glow-subtle);
    }

    .prov-real-logo {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .prov-name {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text-primary);
    }

    .provider-locked-card {
      min-height: 64px;
      border-radius: 14px;
      border: 1px solid var(--accent-cyan);
      background: var(--accent-cyan-soft);
      box-shadow: var(--shadow-glow-subtle);
      padding: 12px 14px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .prov-locked-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .prov-locked-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .prov-locked-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .prov-locked-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 7px;
      border-radius: 6px;
      background: var(--accent-cyan);
      color: var(--accent-cyan-fg);
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
    }

    .prov-locked-desc {
      font-size: 12px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .prov-change-btn {
      background: transparent;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      padding: 6px 12px;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .prov-change-btn:hover {
      background: var(--bg-elevated-hover);
      color: var(--text-primary);
      border-color: var(--border-focus);
    }

    .prov-change-btn:active {
      transform: scale(0.97);
      transition-duration: 80ms;
    }

    .key-box {
      background: var(--bg-key);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 20px 16px;
      text-align: center;
      margin-bottom: 16px;
    }

    .key-value {
      font-family: "SF Mono", "JetBrains Mono", Consolas, monospace;
      font-size: 20px;
      font-weight: 700;
      color: var(--accent-green);
      letter-spacing: 0.04em;
      word-break: break-all;
      user-select: all;
    }

    .actions-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-primary {
      width: 100%;
      min-height: 48px;
      padding: 12px 16px;
      background: var(--accent-cyan);
      color: var(--accent-cyan-fg);
      border: 1px solid transparent;
      border-radius: 14px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .btn-primary:hover {
      background: var(--accent-cyan-hover);
      box-shadow: var(--shadow-glow-cyan);
    }

    .btn-primary:active {
      transform: scale(0.975);
      transition-duration: 80ms;
    }

    .btn-secondary {
      width: 100%;
      min-height: 48px;
      padding: 12px 16px;
      background: var(--bg-elevated);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .btn-secondary:hover {
      background: var(--bg-elevated-hover);
      border-color: var(--border-focus);
      box-shadow: var(--shadow-glow-subtle);
    }

    .btn-secondary:active {
      transform: scale(0.975);
      transition-duration: 80ms;
    }

    .btn-icon-img {
      width: 24px;
      height: 24px;
      object-fit: contain;
      filter: var(--pawn-glow);
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border-subtle);
      font-size: 13px;
      color: var(--text-secondary);
    }

    .timer {
      font-family: "SF Mono", "JetBrains Mono", Consolas, monospace;
      font-weight: 700;
      font-size: 14px;
      color: var(--text-primary);
    }

    .error-msg {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 20px;
    }

    .hidden {
      display: none !important;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        transform: none !important;
      }
    }

    @media (max-width: 480px) {
      .provider-grid,
      .stepper {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

    <main id="error-view" class="card hidden" role="alert">
      <h1 id="error-title">Invalid Link</h1>
      <p id="error-desc" class="error-msg">Please complete the steps in order starting from Step 1.</p>
      <button id="reset-claim-btn" class="btn-primary" type="button">
        <span>BACK TO START</span>
      </button>
    </main>
  </div>

  <script>
    (function () {
      const STORAGE_KEY = 'csp_unique_url_claim_v2';
      const STEP_STORAGE_KEY = 'csp_checkpoint_progress_v2';
      const WORKER_API_BASE = 'https://chess-stealth-key-api.quitworks.workers.dev';

      const SHORTENER_LINKS = {
        link4m: {
          step1: 'https://link4m.org/np1nkMU3',
          step2: 'https://link4m.org/B8IuTLZ'
        },
        shrinkme: {
          step1: 'https://shrinkme.click/ChessProStep1v2',
          step2: 'https://shrinkme.click/ChessProStep2v2'
        },
        lootlabs: {
          step1: 'https://lootdest.org/s?kLgPRTNZ',
          step2: 'https://lootdest.org/s?jqvjbGLG'
        },
        linkvertise: {
          step1: null,
          step2: null
        }
      };

      const PROVIDER_NAMES = {
        link4m: 'Link4m',
        shrinkme: 'ShrinkMe.io',
        lootlabs: 'LootLabs',
        linkvertise: 'Linkvertise'
      };

      let selectedProvider = 'link4m';
      let currentTargetStep = 1;
      let activeClaim = null;
      let step2Token = '';

      const checkpointView = document.getElementById('checkpoint-view');
      const cpTitle = document.getElementById('cp-title');
      const stepBox1 = document.getElementById('step-box-1');
      const stepBox2 = document.getElementById('step-box-2');
      const stepText1 = document.getElementById('step-text-1');
      const stepText2 = document.getElementById('step-text-2');
      const providerGrid = document.getElementById('provider-grid');
      const providerLockedCard = document.getElementById('provider-locked-card');
      const provLockedLogo = document.getElementById('prov-locked-logo');
      const provLockedName = document.getElementById('prov-locked-name');
      const changeProvBtn = document.getElementById('change-prov-btn');
      const provLink4m = document.getElementById('prov-link4m');
      const provShrinkme = document.getElementById('prov-shrinkme');
      const provLootlabs = document.getElementById('prov-lootlabs');
      const provLinkvertise = document.getElementById('prov-linkvertise');
      const goStepBtn = document.getElementById('go-step-btn');
      const goStepText = document.getElementById('go-step-text');

      const validView = document.getElementById('valid-view');
      const errorView = document.getElementById('error-view');
      const errorTitle = document.getElementById('error-title');
      const errorDesc = document.getElementById('error-desc');
      const resetClaimBtn = document.getElementById('reset-claim-btn');

      const keyDisplay = document.getElementById('key-display');
      const copyBtn = document.getElementById('copy-btn');
      const copyText = document.getElementById('copy-text');
      const openAppBtn = document.getElementById('open-app-btn');
      const countdownEl = document.getElementById('countdown');
      const themeToggle = document.getElementById('theme-toggle');

      themeToggle.addEventListener('click', () => {
        const html = document.documentElement;
        const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
      });

      function updateLockedCard() {
        const provBtn = document.getElementById(`prov-${selectedProvider}`);
        const logoImg = provBtn ? provBtn.querySelector('img') : null;
        if (logoImg && provLockedLogo) {
          provLockedLogo.src = logoImg.src;
          provLockedLogo.alt = PROVIDER_NAMES[selectedProvider] || selectedProvider;
        }
        if (provLockedName) {
          provLockedName.textContent = PROVIDER_NAMES[selectedProvider] || selectedProvider;
        }
      }

      function setProvider(name) {
        if (!SHORTENER_LINKS[name]) return;
        selectedProvider = name;
        try {
          localStorage.setItem('chess_stealth_selected_provider', name);
        } catch (_) {}
        provLink4m.classList.toggle('selected', name === 'link4m');
        provShrinkme.classList.toggle('selected', name === 'shrinkme');
        provLootlabs.classList.toggle('selected', name === 'lootlabs');
        provLinkvertise.classList.toggle('selected', name === 'linkvertise');
        updateLockedCard();
      }

      provLink4m.addEventListener('click', () => setProvider('link4m'));
      provShrinkme.addEventListener('click', () => setProvider('shrinkme'));
      provLootlabs.addEventListener('click', () => setProvider('lootlabs'));
      provLinkvertise.addEventListener('click', () => setProvider('linkvertise'));

      changeProvBtn.addEventListener('click', () => {
        if (!confirm('Change provider? This will reset your Step 1 progress.')) return;
        step2Token = '';
        try {
          localStorage.removeItem(STEP_STORAGE_KEY);
        } catch (_) {}
        window.history.replaceState({}, '', window.location.pathname);
        showCheckpointUI(0);
      });

      function showErrorState(title, desc) {
        checkpointView.classList.add('hidden');
        validView.classList.add('hidden');
        errorView.classList.remove('hidden');
        errorTitle.textContent = title;
        errorDesc.textContent = desc;
      }

      function showCheckpointUI(stepDone) {
        validView.classList.add('hidden');
        errorView.classList.add('hidden');
        checkpointView.classList.remove('hidden');

        if (stepDone === 0) {
          currentTargetStep = 1;
          cpTitle.textContent = 'Get 24-Hour Key';
          stepBox1.className = 'step-item active';
          stepBox2.className = 'step-item';
          stepText1.textContent = 'Step 1';
          stepText2.textContent = 'Step 2';
          providerGrid.classList.remove('hidden');
          providerLockedCard.classList.add('hidden');
          goStepText.textContent = 'CONTINUE STEP 1 (1 / 2)';
        } else {
          currentTargetStep = 2;
          cpTitle.textContent = 'Step 1 Completed';
          stepBox1.className = 'step-item done';
          stepBox2.className = 'step-item active';
          stepText1.textContent = 'Completed';
          stepText2.textContent = 'Step 2';
          providerGrid.classList.add('hidden');
          updateLockedCard();
          providerLockedCard.classList.remove('hidden');
          const pName = PROVIDER_NAMES[selectedProvider] || 'Provider';
          goStepText.textContent = `CONTINUE STEP 2 (${pName}) (2 / 2)`;
        }
      }

      function renderValidKey(claim) {
        activeClaim = claim;
        checkpointView.classList.add('hidden');
        errorView.classList.add('hidden');
        validView.classList.remove('hidden');
        keyDisplay.textContent = claim.licenseKey;
        openAppBtn.href = `chesspro://activate?key=${encodeURIComponent(claim.licenseKey)}`;
      }

      goStepBtn.addEventListener('click', () => {
        if (currentTargetStep === 1) {
          window.location.href = `${WORKER_API_BASE}/go/step1?provider=${encodeURIComponent(selectedProvider)}`;
        } else {
          window.location.href = `${WORKER_API_BASE}/go/step2?token=${encodeURIComponent(step2Token)}&provider=${encodeURIComponent(selectedProvider)}`;
        }
      });

      function initPage() {
        const nowSec = Math.floor(Date.now() / 1000);
        const params = new URLSearchParams(window.location.search);
        const errParam = params.get('error');
        const keyParam = params.get('key');
        const tokenParam = params.get('token');
        const stepParam = params.get('step');
        const provParam = params.get('provider');

        // 1. Check for error redirects from Cloudflare Worker
        if (errParam) {
          if (errParam === 'step1_required') {
            showErrorState('Step 1 Incomplete', 'Please complete Step 1 before attempting Step 2.');
          } else if (errParam === 'bypass_detected') {
            showErrorState('Bypass Detected', 'Link skip/bypass detected. Please complete the shortener link normally without fast-skip tools.');
          } else if (errParam === 'rate_limited') {
            showErrorState('Too Many Attempts', 'Rate limit reached for your IP. Please wait a few minutes and try again.');
          } else if (errParam === 'token_expired') {
            showErrorState('Session Expired', 'Your Step 1 verification expired or was already used. Please start again.');
          } else {
            showErrorState('Verification Error', 'Security check could not be completed. Please start from Step 1.');
          }
          return;
        }

        // 2. Check for newly issued key from Cloudflare Worker: ?key=FREE24H-...&token=...
        if (keyParam && keyParam.startsWith('FREE24H-')) {
          const parts = keyParam.split('-');
          if (parts.length === 4) {
            const expSec = parseInt(parts[2], 16);
            if (!isNaN(expSec) && expSec > nowSec) {
              const claim = {
                licenseKey: keyParam,
                urlToken: tokenParam || `${parts[1]}-${parts[2]}`,
                expSec
              };
              try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(claim));
                localStorage.removeItem(STEP_STORAGE_KEY);
              } catch (_) {}
              renderValidKey(claim);
              return;
            }
          }
        }

        // 3. Check for cached valid key in localStorage
        try {
          const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
          if (raw && raw.expSec > nowSec && raw.licenseKey) {
            renderValidKey(raw);
            return;
          } else if (raw && raw.expSec <= nowSec) {
            localStorage.removeItem(STORAGE_KEY);
          }
        } catch (_) {}

        // 4. Check for Step 2 return from Cloudflare Worker: ?step=2&token=...&provider=...
        if (stepParam === '2' && tokenParam) {
          step2Token = tokenParam;
          if (provParam && SHORTENER_LINKS[provParam]) {
            setProvider(provParam);
          }
          try {
            localStorage.setItem(STEP_STORAGE_KEY, JSON.stringify({
              step2Token: tokenParam,
              provider: selectedProvider,
              time: nowSec
            }));
          } catch (_) {}
          showCheckpointUI(1);
          return;
        }

        // 5. Check if Step 2 state was saved and still fresh (< 20 mins)
        try {
          const savedStep = JSON.parse(localStorage.getItem(STEP_STORAGE_KEY) || 'null');
          if (savedStep && savedStep.step2Token && (nowSec - (savedStep.time || 0) < 1200)) {
            step2Token = savedStep.step2Token;
            if (savedStep.provider && SHORTENER_LINKS[savedStep.provider]) {
              setProvider(savedStep.provider);
            }
            showCheckpointUI(1);
            return;
          }
        } catch (_) {}

        // 6. Default: Step 1 Initial Screen
        const savedProv = localStorage.getItem('chess_stealth_selected_provider');
        if (savedProv && SHORTENER_LINKS[savedProv]) {
          setProvider(savedProv);
        }
        showCheckpointUI(0);
      }

      resetClaimBtn.addEventListener('click', () => {
        try {
          localStorage.removeItem(STEP_STORAGE_KEY);
          localStorage.removeItem(STORAGE_KEY);
        } catch (_) {}
        window.location.href = window.location.pathname;
      });

      copyBtn.addEventListener('click', async () => {
        if (!activeClaim) return;
        try {
          await navigator.clipboard.writeText(activeClaim.licenseKey);
          copyText.textContent = 'COPIED';
          setTimeout(() => {
            copyText.textContent = 'COPY KEY';
          }, 2000);
        } catch (_) {
          const range = document.createRange();
          range.selectNodeContents(keyDisplay);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          document.execCommand('copy');
          copyText.textContent = 'COPIED';
        }
      });

      setInterval(() => {
        if (!activeClaim) return;
        const nowSec = Math.floor(Date.now() / 1000);
        const rem = Math.max(0, activeClaim.expSec - nowSec);
        if (rem === 0) {
          try { localStorage.removeItem(STORAGE_KEY); } catch (_) {}
          showErrorState('Key Expired', 'Your 24-hour key has expired. Please claim a new key.');
          activeClaim = null;
          return;
        }
        const h = String(Math.floor(rem / 3600)).padStart(2, '0');
        const m = String(Math.floor((rem % 3600) / 60)).padStart(2, '0');
        const s = String(rem % 60).padStart(2, '0');
        countdownEl.textContent = `${h}:${m}:${s}`;
      }, 1000);

      initPage();
    })();
  </script>
</body>
</html>
