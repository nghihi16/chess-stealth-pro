<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chess Stealth Pro — Get Key</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700&family=Plus+Jakarta+Sans:wght@500;600;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet" />
  <style>
    :root[data-theme="dark"] {
      --bg-page: #07080c;
      --bg-glow-1: rgba(245, 158, 11, 0.12);
      --bg-glow-2: rgba(16, 185, 129, 0.08);
      --bg-card: rgba(17, 19, 26, 0.88);
      --bg-elevated: rgba(28, 32, 43, 0.9);
      --bg-elevated-hover: rgba(38, 43, 58, 1);
      --bg-key: #0b0d13;
      --border-subtle: rgba(255, 255, 255, 0.1);
      --border-focus: #f59e0b;
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --accent-amber: #f59e0b;
      --accent-amber-hover: #fbbf24;
      --accent-amber-fg: #09090b;
      --accent-amber-soft: rgba(245, 158, 11, 0.14);
      --accent-green: #34d399;
      --accent-green-soft: rgba(52, 211, 153, 0.14);
      --accent-red: #f87171;
      --accent-red-soft: rgba(248, 113, 113, 0.14);
      --shadow-card: 0 24px 48px -12px rgba(0, 0, 0, 0.78);
      --shadow-glow-amber: 0 0 24px rgba(245, 158, 11, 0.36);
      --shadow-glow-subtle: 0 0 16px rgba(245, 158, 11, 0.18);
    }

    :root[data-theme="light"] {
      --bg-page: #f1f5f9;
      --bg-glow-1: rgba(217, 119, 6, 0.08);
      --bg-glow-2: rgba(5, 150, 105, 0.06);
      --bg-card: rgba(255, 255, 255, 0.94);
      --bg-elevated: #f8fafc;
      --bg-elevated-hover: #eef2f6;
      --bg-key: #f8fafc;
      --border-subtle: #cbd5e1;
      --border-focus: #d97706;
      --text-primary: #0f172a;
      --text-secondary: #334155;
      --text-muted: #475569;
      --accent-amber: #d97706;
      --accent-amber-hover: #b45309;
      --accent-amber-fg: #ffffff;
      --accent-amber-soft: rgba(217, 119, 6, 0.12);
      --accent-green: #047857;
      --accent-green-soft: rgba(4, 120, 87, 0.11);
      --accent-red: #b91c1c;
      --accent-red-soft: rgba(185, 28, 28, 0.1);
      --shadow-card: 0 20px 40px -15px rgba(15, 23, 42, 0.1);
      --shadow-glow-amber: 0 8px 24px rgba(217, 119, 6, 0.28);
      --shadow-glow-subtle: 0 4px 14px rgba(217, 119, 6, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-page);
      background-image:
        radial-gradient(circle at 18% 18%, var(--bg-glow-1), transparent 40%),
        radial-gradient(circle at 82% 82%, var(--bg-glow-2), transparent 40%);
      color: var(--text-primary);
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      line-height: 1.5;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .shell {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .topbar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      box-shadow: var(--shadow-card);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-family: "Space Grotesk", sans-serif;
      font-weight: 700;
      font-size: 16px;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(245, 158, 11, 0.05));
      border: 1px solid rgba(245, 158, 11, 0.35);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-amber);
      flex-shrink: 0;
    }

    .theme-btn {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-elevated);
      color: var(--text-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .theme-btn:hover {
      background: var(--bg-elevated-hover);
      border-color: var(--border-focus);
      box-shadow: var(--shadow-glow-subtle);
    }

    .theme-btn:focus-visible {
      outline: 2px solid var(--border-focus);
      outline-offset: 2px;
    }

    .card {
      width: 100%;
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 24px;
      box-shadow: var(--shadow-card);
    }

    h1 {
      font-family: "Space Grotesk", sans-serif;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 16px;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    /* Thanh Tiến Trình 2 Chặng Gọn Hiện Đại */
    .stepper {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 24px;
    }

    .step-item {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: border-color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
    }

    .step-num {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--bg-key);
      border: 1px solid var(--border-subtle);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .step-state {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-secondary);
    }

    .step-item.active {
      border-color: var(--accent-amber);
      box-shadow: var(--shadow-glow-subtle);
    }

    .step-item.active .step-num {
      background: var(--accent-amber);
      color: var(--accent-amber-fg);
      border-color: var(--accent-amber);
    }

    .step-item.active .step-state {
      color: var(--text-primary);
    }

    .step-item.done {
      border-color: var(--accent-green);
      background: var(--accent-green-soft);
    }

    .step-item.done .step-num {
      background: var(--accent-green);
      color: #07080a;
      border-color: var(--accent-green);
    }

    .step-item.done .step-state {
      color: var(--accent-green);
    }

    /* Lưới 4 Cổng Vượt Link Kèm Logo Từng Web */
    .provider-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }

    .provider-btn {
      min-height: 60px;
      border-radius: 14px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-elevated);
      color: var(--text-primary);
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      text-align: left;
      transition: border-color 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
    }

    .provider-btn:hover {
      background: var(--bg-elevated-hover);
      border-color: var(--border-focus);
      box-shadow: var(--shadow-glow-subtle);
    }

    .provider-btn.selected {
      border-color: var(--accent-amber);
      background: var(--accent-amber-soft);
      box-shadow: var(--shadow-glow-subtle);
    }

    .provider-btn:focus-visible {
      outline: 2px solid var(--border-focus);
      outline-offset: 2px;
    }

    .prov-logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo-link4m {
      background: rgba(56, 189, 248, 0.16);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .logo-shrinkme {
      background: rgba(168, 85, 247, 0.16);
      color: #c084fc;
      border: 1px solid rgba(168, 85, 247, 0.3);
    }

    .logo-lootlabs {
      background: rgba(250, 204, 21, 0.16);
      color: #facc15;
      border: 1px solid rgba(250, 204, 21, 0.3);
    }

    .logo-linkvertise {
      background: rgba(249, 115, 22, 0.16);
      color: #fb923c;
      border: 1px solid rgba(249, 115, 22, 0.3);
    }

    .prov-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
    }

    /* Hộp Key */
    .key-box {
      background: var(--bg-key);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 20px 16px;
      text-align: center;
      margin-bottom: 16px;
    }

    .key-value {
      font-family: "JetBrains Mono", Consolas, monospace;
      font-size: 20px;
      font-weight: 700;
      color: var(--accent-green);
      letter-spacing: 0.04em;
      word-break: break-all;
      user-select: all;
    }

    .actions-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-primary {
      width: 100%;
      min-height: 48px;
      padding: 12px 16px;
      background: var(--accent-amber);
      color: var(--accent-amber-fg);
      border: 1px solid transparent;
      border-radius: 12px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      transition: background-color 0.15s ease, box-shadow 0.15s ease;
    }

    .btn-primary:hover {
      background: var(--accent-amber-hover);
      box-shadow: var(--shadow-glow-amber);
    }

    .btn-primary:focus-visible {
      outline: 2px solid var(--border-focus);
      outline-offset: 2px;
    }

    .btn-secondary {
      width: 100%;
      min-height: 48px;
      padding: 12px 16px;
      background: var(--bg-elevated);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      transition: background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .btn-secondary:hover {
      background: var(--bg-elevated-hover);
      border-color: var(--border-focus);
      box-shadow: var(--shadow-glow-subtle);
    }

    .btn-secondary:focus-visible {
      outline: 2px solid var(--border-focus);
      outline-offset: 2px;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border-subtle);
      font-size: 13px;
      color: var(--text-secondary);
    }

    .timer {
      font-family: "JetBrains Mono", Consolas, monospace;
      font-weight: 700;
      font-size: 14px;
      color: var(--text-primary);
    }

    .error-msg {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 20px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 480px) {
      .provider-grid,
      .stepper {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

      const errorView = document.getElementById('error-view');
      const errorTitle = document.getElementById('error-title');
      const errorDesc = document.getElementById('error-desc');
      const resetClaimBtn = document.getElementById('reset-claim-btn');

      const keyDisplay = document.getElementById('key-display');
      const copyBtn = document.getElementById('copy-btn');
      const copyText = document.getElementById('copy-text');
      const openAppBtn = document.getElementById('open-app-btn');
      const countdownEl = document.getElementById('countdown');
      const themeToggle = document.getElementById('theme-toggle');

      themeToggle.addEventListener('click', () => {
        const html = document.documentElement;
        const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
      });

      function setProvider(name) {
        selectedProvider = name;
        provLink4m.classList.toggle('selected', name === 'link4m');
        provShrinkme.classList.toggle('selected', name === 'shrinkme');
        provLootlabs.classList.toggle('selected', name === 'lootlabs');
        provLinkvertise.classList.toggle('selected', name === 'linkvertise');
      }

      provLink4m.addEventListener('click', () => setProvider('link4m'));
      provShrinkme.addEventListener('click', () => setProvider('shrinkme'));
      provLootlabs.addEventListener('click', () => setProvider('lootlabs'));
      provLinkvertise.addEventListener('click', () => setProvider('linkvertise'));

      async function hmacHex(message) {
        const enc = new TextEncoder();
        const cryptoKey = await crypto.subtle.importKey(
          'raw',
          enc.encode(SECRET_STR),
          { name: 'HMAC', hash: 'SHA-256' },
          false,
          ['sign']
        );
        const sigBuf = await crypto.subtle.sign('HMAC', cryptoKey, enc.encode(message));
        return Array.from(new Uint8Array(sigBuf))
          .map(b => b.toString(16).padStart(2, '0'))
          .join('')
          .toUpperCase();
      }

      function randomHex6() {
        const arr = new Uint8Array(3);
        crypto.getRandomValues(arr);
        return Array.from(arr).map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
      }

      async function buildTokenAndKey(tokenId, expSec) {
        const expHex = expSec.toString(16).toUpperCase().padStart(8, '0');
        const urlSig = (await hmacHex(`URL:${tokenId}:${expHex}`)).slice(0, 10);
        const keySig = (await hmacHex(`KEY:${tokenId}:${expHex}`)).slice(0, 6);
        return {
          tokenId,
          expSec,
          expHex,
          urlToken: `${tokenId}-${expHex}-${urlSig}`,
          licenseKey: `FREE24H-${tokenId}-${expHex}-${keySig}`
        };
      }

      function showErrorState(title, desc) {
        checkpointView.classList.add('hidden');
        validView.classList.add('hidden');
        errorView.classList.remove('hidden');
        errorTitle.textContent = title;
        errorDesc.textContent = desc;
      }

      function showCheckpointUI(stepDone) {
        validView.classList.add('hidden');
        errorView.classList.add('hidden');
        checkpointView.classList.remove('hidden');

        if (stepDone === 0) {
          currentTargetStep = 1;
          cpTitle.textContent = 'Nhận Key 24 Giờ';
          stepBox1.className = 'step-item active';
          stepBox2.className = 'step-item';
          stepText1.textContent = 'Chặng 1';
          stepText2.textContent = 'Chặng 2';
          goStepText.textContent = 'VƯỢT CHẶNG 1 (1 / 2)';
        } else {
          currentTargetStep = 2;
          cpTitle.textContent = 'Hoàn Thành Chặng 1';
          stepBox1.className = 'step-item done';
          stepBox2.className = 'step-item active';
          stepText1.textContent = 'Đã xong';
          stepText2.textContent = 'Chặng 2';
          goStepText.textContent = 'VƯỢT CHẶNG 2 (2 / 2)';
        }
      }

      function renderValidKey(claim) {
        activeClaim = claim;
        checkpointView.classList.add('hidden');
        errorView.classList.add('hidden');
        validView.classList.remove('hidden');
        keyDisplay.textContent = claim.licenseKey;
        openAppBtn.href = `chesspro://activate?key=${encodeURIComponent(claim.licenseKey)}`;
      }

      goStepBtn.addEventListener('click', () => {
        const nowSec = Math.floor(Date.now() / 1000);
        try {
          const prev = JSON.parse(localStorage.getItem(STEP_STORAGE_KEY) || '{}');
          prev.expectedStep = currentTargetStep;
          prev.startedAt = nowSec;
          prev.provider = selectedProvider;
          localStorage.setItem(STEP_STORAGE_KEY, JSON.stringify(prev));
        } catch (_) {}

        const provLinks = SHORTENER_LINKS[selectedProvider] || SHORTENER_LINKS.link4m;
        const dest = (currentTargetStep === 1 ? provLinks.step1 : provLinks.step2) || buildLinkvertiseUrl(currentTargetStep);
        window.location.href = dest;
      });

      async function initPage() {
        const nowSec = Math.floor(Date.now() / 1000);
        const params = new URLSearchParams(window.location.search);
        const urlTokenParam = params.get('token');
        const stepParam = params.get('step');

        let savedClaim = null;
        try {
          const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
          if (raw && raw.expSec > nowSec && raw.urlToken && raw.licenseKey) {
            savedClaim = raw;
          } else if (raw && raw.expSec <= nowSec) {
            localStorage.removeItem(STORAGE_KEY);
          }
        } catch (_) {}

        if (urlTokenParam) {
          const parts = urlTokenParam.trim().toUpperCase().split('-');
          if (parts.length !== 3 || parts[0].length !== 6 || parts[1].length !== 8 || parts[2].length !== 10) {
            showErrorState('URL Không Hợp Lệ', 'Đường dẫn đã bị thay đổi.');
            return;
          }

          const [tId, expHex, providedSig] = parts;
          const expSec = parseInt(expHex, 16);
          const expectedUrlSig = (await hmacHex(`URL:${tId}:${expHex}`)).slice(0, 10);
          if (isNaN(expSec) || providedSig !== expectedUrlSig) {
            showErrorState('URL Không Hợp Lệ', 'Chữ ký đường dẫn không khớp.');
            return;
          }

          if (expSec <= nowSec) {
            try { localStorage.removeItem(STORAGE_KEY); } catch (_) {}
            showErrorState('Key Đã Hết Hạn', 'Key 24 giờ đã tự động xóa.');
            return;
          }

          const verifiedClaim = await buildTokenAndKey(tId, expSec);
          renderValidKey(verifiedClaim);
          return;
        }

        let stepState = {};
        try {
          stepState = JSON.parse(localStorage.getItem(STEP_STORAGE_KEY) || '{}');
          if (stepState.provider && SHORTENER_LINKS[stepState.provider]) {
            setProvider(stepState.provider);
          }
        } catch (_) {}

        if (stepParam === '1') {
          stepState.step1Completed = true;
          stepState.step1Time = nowSec;
          try {
            localStorage.setItem(STEP_STORAGE_KEY, JSON.stringify(stepState));
          } catch (_) {}
          window.history.replaceState({}, '', window.location.pathname);
          showCheckpointUI(1);
          return;
        }

        if (stepParam === '2') {
          if (!stepState.step1Completed || (nowSec - (stepState.step1Time || 0)) > 7200) {
            showErrorState('Chưa Qua Chặng 1', 'Vui lòng vượt Chặng 1 trước.');
            return;
          }

          localStorage.removeItem(STEP_STORAGE_KEY);
          if (!savedClaim) {
            const newId = randomHex6();
            const newExp = nowSec + 86400;
            savedClaim = await buildTokenAndKey(newId, newExp);
            try {
              localStorage.setItem(STORAGE_KEY, JSON.stringify(savedClaim));
            } catch (_) {}
          }
          const newUrl = `${window.location.pathname}?token=${savedClaim.urlToken}`;
          window.history.replaceState({ token: savedClaim.urlToken }, '', newUrl);
          renderValidKey(savedClaim);
          return;
        }

        if (savedClaim) {
          const newUrl = `${window.location.pathname}?token=${savedClaim.urlToken}`;
          window.history.replaceState({ token: savedClaim.urlToken }, '', newUrl);
          renderValidKey(savedClaim);
          return;
        }

        if (stepState.step1Completed && (nowSec - (stepState.step1Time || 0)) <= 7200) {
          showCheckpointUI(1);
        } else {
          showCheckpointUI(0);
        }
      }

      resetClaimBtn.addEventListener('click', () => {
        try { localStorage.removeItem(STEP_STORAGE_KEY); } catch (_) {}
        window.location.href = window.location.pathname;
      });

      copyBtn.addEventListener('click', async () => {
        if (!activeClaim) return;
        try {
          await navigator.clipboard.writeText(activeClaim.licenseKey);
          copyText.textContent = 'ĐÃ SAO CHÉP';
          setTimeout(() => {
            copyText.textContent = 'SAO CHÉP KEY';
          }, 2000);
        } catch (_) {
          const range = document.createRange();
          range.selectNodeContents(keyDisplay);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          document.execCommand('copy');
          copyText.textContent = 'ĐÃ SAO CHÉP';
        }
      });

      setInterval(() => {
        if (!activeClaim) return;
        const nowSec = Math.floor(Date.now() / 1000);
        const rem = Math.max(0, activeClaim.expSec - nowSec);
        if (rem === 0) {
          showErrorState('Key Đã Hết Hạn', 'Key 24 giờ đã tự động xóa.');
          return;
        }
        const h = String(Math.floor(rem / 3600)).padStart(2, '0');
        const m = String(Math.floor((rem % 3600) / 60)).padStart(2, '0');
        const s = String(rem % 60).padStart(2, '0');
        countdownEl.textContent = `${h}:${m}:${s}`;
      }, 1000);

      initPage();
    })();
  </script>
</body>
</html>
