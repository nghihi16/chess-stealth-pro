  <style>
    :root[data-theme="dark"] {
      --bg-page: #060911;
      --bg-glow-1: rgba(34, 211, 238, 0.14);
      --bg-glow-2: rgba(59, 130, 246, 0.10);
      --bg-card: rgba(13, 18, 30, 0.88);
      --bg-elevated: rgba(22, 30, 46, 0.92);
      --bg-elevated-hover: rgba(30, 41, 62, 1);
      --bg-key: #090d16;
      --border-subtle: rgba(148, 163, 184, 0.16);
      --border-focus: #22d3ee;
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --accent-cyan: #22d3ee;
      --accent-cyan-hover: #38bdf8;
      --accent-cyan-fg: #060911;
      --accent-cyan-soft: rgba(34, 211, 238, 0.14);
      --accent-green: #34d399;
      --accent-green-soft: rgba(52, 211, 153, 0.14);
      --shadow-card: 0 24px 48px -12px rgba(0, 0, 0, 0.82);
      --shadow-glow-cyan: 0 0 26px rgba(34, 211, 238, 0.38);
      --shadow-glow-subtle: 0 0 16px rgba(34, 211, 238, 0.20);
      --pawn-glow: drop-shadow(0 0 16px rgba(34, 211, 238, 0.65)) drop-shadow(0 4px 10px rgba(0, 0, 0, 0.7));
    }

    :root[data-theme="light"] {
      --bg-page: #f1f5f9;
      --bg-glow-1: rgba(14, 165, 233, 0.10);
      --bg-glow-2: rgba(37, 99, 235, 0.06);
      --bg-card: rgba(255, 255, 255, 0.95);
      --bg-elevated: #f8fafc;
      --bg-elevated-hover: #eef2f6;
      --bg-key: #f8fafc;
      --border-subtle: #cbd5e1;
      --border-focus: #0284c7;
      --text-primary: #0f172a;
      --text-secondary: #334155;
      --text-muted: #475569;
      --accent-cyan: #0284c7;
      --accent-cyan-hover: #0369a1;
      --accent-cyan-fg: #ffffff;
      --accent-cyan-soft: rgba(2, 132, 199, 0.12);
      --accent-green: #047857;
      --accent-green-soft: rgba(4, 120, 87, 0.11);
      --shadow-card: 0 20px 40px -15px rgba(15, 23, 42, 0.10);
      --shadow-glow-cyan: 0 8px 24px rgba(2, 132, 199, 0.28);
      --shadow-glow-subtle: 0 4px 14px rgba(2, 132, 199, 0.16);
      --pawn-glow: drop-shadow(0 4px 12px rgba(2, 132, 199, 0.35));
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-page);
      background-image:
        radial-gradient(circle at 20% 15%, var(--bg-glow-1), transparent 42%),
        radial-gradient(circle at 80% 85%, var(--bg-glow-2), transparent 42%);
      color: var(--text-primary);
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      line-height: 1.5;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .shell {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .topbar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      box-shadow: var(--shadow-card);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 14px;
    }

    /* 3D Chess Stealth Pawn — NO background box, glowing highlight */
    .pawn-hero-img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      filter: var(--pawn-glow);
      flex-shrink: 0;
      transition: transform 0.2s ease;
    }

    .brand:hover .pawn-hero-img {
      transform: translateY(-1px) scale(1.04);
    }

    .brand-titles {
      display: flex;
      flex-direction: column;
      line-height: 1.15;
    }

    .brand-chess {
      font-family: "Space Grotesk", sans-serif;
      font-weight: 700;
      font-size: 17px;
      letter-spacing: 0.24em;
      color: var(--text-primary);
    }

    .brand-stealth {
      font-family: "Space Grotesk", sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.34em;
      color: var(--accent-cyan);
      margin-top: 2px;
    }

    .theme-btn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-elevated);
      color: var(--text-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .theme-btn:hover {
      background: var(--bg-elevated-hover);
      border-color: var(--border-focus);
      box-shadow: var(--shadow-glow-subtle);
    }

    .card {
      width: 100%;
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 24px;
      box-shadow: var(--shadow-card);
    }

    h1 {
      font-family: "Space Grotesk", sans-serif;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 16px;
      letter-spacing: -0.01em;
      color: var(--text-primary);
    }

    .stepper {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .step-item {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: border-color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
    }

    .step-num {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--bg-key);
      border: 1px solid var(--border-subtle);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .step-state {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-secondary);
    }

    .step-item.active {
      border-color: var(--accent-cyan);
      box-shadow: var(--shadow-glow-subtle);
    }

    .step-item.active .step-num {
      background: var(--accent-cyan);
      color: var(--accent-cyan-fg);
      border-color: var(--accent-cyan);
    }

    .step-item.active .step-state {
      color: var(--text-primary);
    }

    .step-item.done {
      border-color: var(--accent-green);
      background: var(--accent-green-soft);
    }

    .step-item.done .step-num {
      background: var(--accent-green);
      color: #060911;
      border-color: var(--accent-green);
    }

    .step-item.done .step-state {
      color: var(--accent-green);
    }

    .provider-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .provider-btn {
      min-height: 62px;
      border-radius: 14px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-elevated);
      color: var(--text-primary);
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      text-align: left;
      transition: border-color 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
    }

    .provider-btn:hover {
      background: var(--bg-elevated-hover);
      border-color: var(--border-focus);
      box-shadow: var(--shadow-glow-subtle);
    }

    .provider-btn.selected {
      border-color: var(--accent-cyan);
      background: var(--accent-cyan-soft);
      box-shadow: var(--shadow-glow-subtle);
    }

    .prov-real-logo {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .prov-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .key-box {
      background: var(--bg-key);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 20px 16px;
      text-align: center;
      margin-bottom: 16px;
    }

    .key-value {
      font-family: "JetBrains Mono", Consolas, monospace;
      font-size: 20px;
      font-weight: 700;
      color: var(--accent-green);
      letter-spacing: 0.04em;
      word-break: break-all;
      user-select: all;
    }

    .actions-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-primary {
      width: 100%;
      min-height: 48px;
      padding: 12px 16px;
      background: var(--accent-cyan);
      color: var(--accent-cyan-fg);
      border: 1px solid transparent;
      border-radius: 12px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      transition: background-color 0.15s ease, box-shadow 0.15s ease;
    }

    .btn-primary:hover {
      background: var(--accent-cyan-hover);
      box-shadow: var(--shadow-glow-cyan);
    }

    .btn-secondary {
      width: 100%;
      min-height: 48px;
      padding: 12px 16px;
      background: var(--bg-elevated);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      transition: background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .btn-secondary:hover {
      background: var(--bg-elevated-hover);
      border-color: var(--border-focus);
      box-shadow: var(--shadow-glow-subtle);
    }

    .btn-icon-img {
      width: 24px;
      height: 24px;
      object-fit: contain;
      filter: var(--pawn-glow);
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border-subtle);
      font-size: 13px;
      color: var(--text-secondary);
    }

    .timer {
      font-family: "JetBrains Mono", Consolas, monospace;
      font-weight: 700;
      font-size: 14px;
      color: var(--text-primary);
    }

    .error-msg {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 20px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 480px) {
      .provider-grid,
      .stepper {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

  <script>
    (function () {
      const STORAGE_KEY = 'csp_unique_url_claim_v2';
      const STEP_STORAGE_KEY = 'csp_checkpoint_progress_v2';
      const SECRET_STR = 'CHESS_STEALTH_PRO_WEB24H_SECRET_2026';
      const LINKVERTISE_USER_ID = '10578379';

      function buildLinkvertiseUrl(stepNum) {
        const base = `${window.location.origin}${window.location.pathname}?step=${stepNum}`;
        const rand = Math.floor(Math.random() * 900 + 100);
        return `https://link-to.net/${LINKVERTISE_USER_ID}/${rand}/dynamic?r=${btoa(encodeURI(base))}`;
      }

      const SHORTENER_LINKS = {
        link4m: {
          step1: 'https://link4m.org/np1nkMU3',
          step2: 'https://link4m.org/B8IuTLZ'
        },
        shrinkme: {
          step1: 'https://shrinkme.click/ChessProStep1v2',
          step2: 'https://shrinkme.click/ChessProStep2v2'
        },
        lootlabs: {
          step1: 'https://lootdest.org/s?kLgPRTNZ',
          step2: 'https://lootdest.org/s?jqvjbGLG'
        },
        linkvertise: {
          step1: null,
          step2: null
        }
      };

      let selectedProvider = 'link4m';
      let currentTargetStep = 1;
      let activeClaim = null;

      const checkpointView = document.getElementById('checkpoint-view');
      const cpTitle = document.getElementById('cp-title');
      const stepBox1 = document.getElementById('step-box-1');
      const stepBox2 = document.getElementById('step-box-2');
      const stepText1 = document.getElementById('step-text-1');
      const stepText2 = document.getElementById('step-text-2');
      const provLink4m = document.getElementById('prov-link4m');
      const provShrinkme = document.getElementById('prov-shrinkme');
      const provLootlabs = document.getElementById('prov-lootlabs');
      const provLinkvertise = document.getElementById('prov-linkvertise');
      const goStepBtn = document.getElementById('go-step-btn');
      const goStepText = document.getElementById('go-step-text');

      const validView = document.getElementById('valid-view');
      const errorView = document.getElementById('error-view');
      const errorTitle = document.getElementById('error-title');
      const errorDesc = document.getElementById('error-desc');
      const resetClaimBtn = document.getElementById('reset-claim-btn');

      const keyDisplay = document.getElementById('key-display');
      const copyBtn = document.getElementById('copy-btn');
      const copyText = document.getElementById('copy-text');
      const openAppBtn = document.getElementById('open-app-btn');
      const countdownEl = document.getElementById('countdown');
      const themeToggle = document.getElementById('theme-toggle');

      themeToggle.addEventListener('click', () => {
        const html = document.documentElement;
        const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
      });

      function setProvider(name) {
        selectedProvider = name;
        provLink4m.classList.toggle('selected', name === 'link4m');
        provShrinkme.classList.toggle('selected', name === 'shrinkme');
        provLootlabs.classList.toggle('selected', name === 'lootlabs');
        provLinkvertise.classList.toggle('selected', name === 'linkvertise');
      }

      provLink4m.addEventListener('click', () => setProvider('link4m'));
      provShrinkme.addEventListener('click', () => setProvider('shrinkme'));
      provLootlabs.addEventListener('click', () => setProvider('lootlabs'));
      provLinkvertise.addEventListener('click', () => setProvider('linkvertise'));

      async function hmacHex(message) {
        const enc = new TextEncoder();
        const cryptoKey = await crypto.subtle.importKey(
          'raw',
          enc.encode(SECRET_STR),
          { name: 'HMAC', hash: 'SHA-256' },
          false,
          ['sign']
        );
        const sigBuf = await crypto.subtle.sign('HMAC', cryptoKey, enc.encode(message));
        return Array.from(new Uint8Array(sigBuf))
          .map(b => b.toString(16).padStart(2, '0'))
          .join('')
          .toUpperCase();
      }

      function randomHex6() {
        const arr = new Uint8Array(3);
        crypto.getRandomValues(arr);
        return Array.from(arr).map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
      }

      async function buildTokenAndKey(tokenId, expSec) {
        const expHex = expSec.toString(16).toUpperCase().padStart(8, '0');
        const urlSig = (await hmacHex(`URL:${tokenId}:${expHex}`)).slice(0, 10);
        const keySig = (await hmacHex(`KEY:${tokenId}:${expHex}`)).slice(0, 6);
        return {
          tokenId,
          expSec,
          expHex,
          urlToken: `${tokenId}-${expHex}-${urlSig}`,
          licenseKey: `FREE24H-${tokenId}-${expHex}-${keySig}`
        };
      }

      function showErrorState(title, desc) {
        checkpointView.classList.add('hidden');
        validView.classList.add('hidden');
        errorView.classList.remove('hidden');
        errorTitle.textContent = title;
        errorDesc.textContent = desc;
      }

      function showCheckpointUI(stepDone) {
        validView.classList.add('hidden');
        errorView.classList.add('hidden');
        checkpointView.classList.remove('hidden');

        if (stepDone === 0) {
          currentTargetStep = 1;
          cpTitle.textContent = 'Get 24-Hour Key';
          stepBox1.className = 'step-item active';
          stepBox2.className = 'step-item';
          stepText1.textContent = 'Step 1';
          stepText2.textContent = 'Step 2';
          goStepText.textContent = 'CONTINUE STEP 1 (1 / 2)';
        } else {
          currentTargetStep = 2;
          cpTitle.textContent = 'Step 1 Completed';
          stepBox1.className = 'step-item done';
          stepBox2.className = 'step-item active';
          stepText1.textContent = 'Completed';
          stepText2.textContent = 'Step 2';
          goStepText.textContent = 'CONTINUE STEP 2 (2 / 2)';
        }
      }

      function renderValidKey(claim) {
        activeClaim = claim;
        checkpointView.classList.add('hidden');
        errorView.classList.add('hidden');
        validView.classList.remove('hidden');
        keyDisplay.textContent = claim.licenseKey;
        openAppBtn.href = `chesspro://activate?key=${encodeURIComponent(claim.licenseKey)}`;
      }

      goStepBtn.addEventListener('click', () => {
        const nowSec = Math.floor(Date.now() / 1000);
        try {
          const prev = JSON.parse(localStorage.getItem(STEP_STORAGE_KEY) || '{}');
          prev.expectedStep = currentTargetStep;
          prev.startedAt = nowSec;
          prev.provider = selectedProvider;
          localStorage.setItem(STEP_STORAGE_KEY, JSON.stringify(prev));
        } catch (_) {}

        const provLinks = SHORTENER_LINKS[selectedProvider] || SHORTENER_LINKS.link4m;
        const dest = (currentTargetStep === 1 ? provLinks.step1 : provLinks.step2) || buildLinkvertiseUrl(currentTargetStep);
        window.location.href = dest;
      });

      async function initPage() {
        const nowSec = Math.floor(Date.now() / 1000);
        const params = new URLSearchParams(window.location.search);
        const urlTokenParam = params.get('token');
        const stepParam = params.get('step');

        let savedClaim = null;
        try {
          const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
          if (raw && raw.expSec > nowSec && raw.urlToken && raw.licenseKey) {
            savedClaim = raw;
          } else if (raw && raw.expSec <= nowSec) {
            localStorage.removeItem(STORAGE_KEY);
          }
        } catch (_) {}

        if (urlTokenParam) {
          const parts = urlTokenParam.trim().toUpperCase().split('-');
          if (parts.length !== 3 || parts[0].length !== 6 || parts[1].length !== 8 || parts[2].length !== 10) {
            showErrorState('Invalid URL', 'The key URL has been modified.');
            return;
          }

          const [tId, expHex, providedSig] = parts;
          const expSec = parseInt(expHex, 16);
          const expectedUrlSig = (await hmacHex(`URL:${tId}:${expHex}`)).slice(0, 10);
          if (isNaN(expSec) || providedSig !== expectedUrlSig) {
            showErrorState('Invalid URL', 'URL signature verification failed.');
            return;
          }

          if (expSec <= nowSec) {
            try { localStorage.removeItem(STORAGE_KEY); } catch (_) {}
            showErrorState('Key Expired', 'Your 24-hour key has expired.');
            return;
          }

          const verifiedClaim = await buildTokenAndKey(tId, expSec);
          renderValidKey(verifiedClaim);
          return;
        }

        let stepState = {};
        try {
          stepState = JSON.parse(localStorage.getItem(STEP_STORAGE_KEY) || '{}');
          if (stepState.provider && SHORTENER_LINKS[stepState.provider]) {
            setProvider(stepState.provider);
          }
        } catch (_) {}

        if (stepParam === '1') {
          stepState.step1Completed = true;
          stepState.step1Time = nowSec;
          try {
            localStorage.setItem(STEP_STORAGE_KEY, JSON.stringify(stepState));
          } catch (_) {}
          window.history.replaceState({}, '', window.location.pathname);
          showCheckpointUI(1);
          return;
        }

        if (stepParam === '2') {
          if (!stepState.step1Completed || (nowSec - (stepState.step1Time || 0)) > 7200) {
            showErrorState('Step 1 Required', 'Please complete Step 1 first.');
            return;
          }

          localStorage.removeItem(STEP_STORAGE_KEY);
          if (!savedClaim) {
            const newId = randomHex6();
            const newExp = nowSec + 86400;
            savedClaim = await buildTokenAndKey(newId, newExp);
            try {
              localStorage.setItem(STORAGE_KEY, JSON.stringify(savedClaim));
            } catch (_) {}
          }
          const newUrl = `${window.location.pathname}?token=${savedClaim.urlToken}`;
          window.history.replaceState({ token: savedClaim.urlToken }, '', newUrl);
          renderValidKey(savedClaim);
          return;
        }

        if (savedClaim) {
          const newUrl = `${window.location.pathname}?token=${savedClaim.urlToken}`;
          window.history.replaceState({ token: savedClaim.urlToken }, '', newUrl);
          renderValidKey(savedClaim);
          return;
        }

        if (stepState.step1Completed && (nowSec - (stepState.step1Time || 0)) <= 7200) {
          showCheckpointUI(1);
        } else {
          showCheckpointUI(0);
        }
      }

      resetClaimBtn.addEventListener('click', () => {
        try { localStorage.removeItem(STEP_STORAGE_KEY); } catch (_) {}
        window.location.href = window.location.pathname;
      });

      copyBtn.addEventListener('click', async () => {
        if (!activeClaim) return;
        try {
          await navigator.clipboard.writeText(activeClaim.licenseKey);
          copyText.textContent = 'COPIED';
          setTimeout(() => {
            copyText.textContent = 'COPY KEY';
          }, 2000);
        } catch (_) {
          const range = document.createRange();
          range.selectNodeContents(keyDisplay);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          document.execCommand('copy');
          copyText.textContent = 'COPIED';
        }
      });

      setInterval(() => {
        if (!activeClaim) return;
        const nowSec = Math.floor(Date.now() / 1000);
        const rem = Math.max(0, activeClaim.expSec - nowSec);
        if (rem === 0) {
          showErrorState('Key Expired', 'Your 24-hour key has expired.');
          return;
        }
        const h = String(Math.floor(rem / 3600)).padStart(2, '0');
        const m = String(Math.floor((rem % 3600) / 60)).padStart(2, '0');
        const s = String(rem % 60).padStart(2, '0');
        countdownEl.textContent = `${h}:${m}:${s}`;
      }, 1000);

      initPage();
    })();
  </script>
</body>
</html>
